        <!-- Membuat Header -->

         <!-- Membuat Konten -->
           <h2>Colspan dan Rowspan pada Table</h2>
        <!-- colspan : menggabungkan kolom -->
        <!-- rowspan : menggabungkan baris -->
        <table class="grade-table">
            <tr>
                <th rowspan="2">No</th>
                <th rowspan="2">Nama</th>
                <th colspan="2">Nilai</th>
            </tr>
            <tr>
                <td>Ulangan 1</td>
                <td>Ulangan 2</td>
            </tr>
            <tr>
                <td>1</td>
                <td>Abelle</td>
                <td>100</td>
                <td>90</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Gus Bayem</td>
                <td>67</td>
                <td>67</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Kim Ryul</td>
                <td>41</td>
                <td>45</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Louis</td>
                <td>100</td>
                <td>100</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Ohyul</td>
                <td>88</td>
                <td>79</td>
            </tr>
        </table>
        <h2>Table Merge</h2>
        <table class="colorful-table">
            <tr class="row-coral">
                <th rowspan="3">A</th>
                <th rowspan="2">B</th>
                <th colspan="2">C</th>
                <th rowspan="3">D</th>
                <th rowspan="4">E</th>
                <th rowspan="2">N</th>
                <th rowspan="6">H</th>
            </tr>
            <tr class="row-peach">
                <th rowspan="1">F</th>
                <th>G</th>
            </tr>
            <tr class="row-yellow">
                <th>I</th>
                <th>J</th>
                <th>K</th>
                <th rowspan="2"> O </th>
            </tr>
            <tr class="row-mint">
                <th colspan="5"> M </th>
            </tr>
            <tr class="row-blue">
                <th rowspan="2"> P </th>
                <th colspan="2"> Q </th>
                <th rowspan="2"> R </th>
                <th> U </th>
                <th> V </th>
                <th> W </th>
            </tr>
            <tr class="row-lavender">
                <th> S </th> 
                <th> T </th>
                <th> X </th>
                <th> Y </th>
                <th> Z </th>
            </tr>
        </table>
    </body>
</html>
